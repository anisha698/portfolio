<body class="plain">
<main class="visitors-wrap">
  <header class="visitors-head">
    <h1>Visitor logs</h1>
    <a href="/" class="meta">← back home</a>
  </header>

  <div id="vGrid" class="visitors-grid">
    <p style="color:var(--home-sub); font-size:14px;">Loading…</p>
  </div>
</main>

<script>
(async function () {
  const grid = document.getElementById("vGrid");
  try {
    const r = await fetch("/api/visitors?limit=300");
    if (!r.ok) throw new Error("api");
    const { visitors } = await r.json();
    if (!visitors || visitors.length === 0) {
      grid.innerHTML = '<p style="color:var(--home-sub); font-size:14px;">No visitors yet. Be the first.</p>';
      return;
    }
    grid.innerHTML = visitors.map((v) => {
      const d = new Date(v.date);
      const months = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
      const dateStr = `${String(d.getDate()).padStart(2,"0")} ${months[d.getMonth()]} ${d.getFullYear()}`;
      const numStr = `#${String(v.n).padStart(4,"0")}`;
      const sig = v.signatureUrl
        ? `<img src="${v.signatureUrl}" alt="signature" />`
        : '<span>unsigned</span>';
      const init = v.initials ? `<div class="v-init">${v.initials}</div>` : "";
      return `
        <article class="v-card">
          <div class="v-num">VISITOR ${numStr}</div>
          <div class="v-name">${v.name || ""}</div>
          <div class="v-date">${dateStr}</div>
          <div class="v-sig ${v.signatureUrl ? "" : "empty"}">${sig}</div>
          ${init}
        </article>
      `;
    }).join("");
  } catch (e) {
    grid.innerHTML = '<p style="color:var(--home-sub); font-size:14px;">Couldn\'t load the log right now.</p>';
  }
})();
</script>

<footer class="plain-foot">
  <span>© <span id="yr"></span> Anisha Rajan</span>
  <span>ツ</span>
</footer>
<script>
  document.getElementById("yr").textContent = new Date().getFullYear();
</script>
</body>
</html>
